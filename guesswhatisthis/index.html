<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Surprise!</title>
    <style>
        body {
            background: #ffebf0;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.2);
            position: relative;
        }

        h1 {
            color: #ff3366;
            font-size: 2.5em;
            margin-bottom: 1.5rem;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 2rem;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2em;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.3s;
        }

        #yesBtn {
            background: #ff3366;
            color: white;
        }

        #noBtn {
            background: #e0e0e0;
            color: #666;
            position: relative;
        }

        .hearts {
            position: absolute;
            pointer-events: none;
            animation: float 3s infinite;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        .hidden {
            display: none;
        }

        #message {
            font-size: 2em;
            color: #ff3366;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .location-section {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .location-image {
            width: 100%;
            max-width: 500px;
            border-radius: 15px;
            border: 4px solid #ff3366;
        }

        #changeLocation {
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1.1em;
        }

        .visible {
            display: flex !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Will you be my Valentine? 💖</h1>
        <div class="buttons">
            <button id="yesBtn">Yes! 😍</button>
            <button id="noBtn">No 😢</button>
        </div>
        <div class="location-section" id="locationSection">
            <h2>Our First Valentine's Date! 🗺️</h2>
            <img src="./location.png" alt="Location" class="location-image" id="locationImage">
            <button id="changeLocation">Change Location Image</button>
        </div>    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const message = document.getElementById('message');
        const container = document.querySelector('.container');

        noBtn.addEventListener('mouseover', () => {
            const containerRect = container.getBoundingClientRect();
            const maxX = containerRect.width - noBtn.offsetWidth;
            const maxY = containerRect.height - noBtn.offsetHeight;

            noBtn.style.position = 'absolute';
            noBtn.style.left = Math.random() * maxX + 'px';
            noBtn.style.top = Math.random() * maxY + 'px';
        });

        yesBtn.addEventListener('click', () => {
            document.querySelector('.buttons').classList.add('hidden');
            message.classList.remove('hidden');
            startConfetti();
        });

        function startConfetti() {
            for (let i = 0; i < 50; i++) {
                createHeart();
            }
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.innerHTML = '💖';
            heart.classList.add('hearts');
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDelay = Math.random() * 2 + 's';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 3000);
        }

        const locationSection = document.getElementById('locationSection');
        const locationImage = document.getElementById('locationImage');

        yesBtn.addEventListener('click', () => {
            document.querySelector('.buttons').classList.add('hidden');
            locationSection.classList.add('visible');
            startConfetti();
        });

        document.getElementById('changeLocation').addEventListener('click', () => {
            const newImage = prompt('Enter the URL of your preferred location image:');
            if (newImage) {
                locationImage.src = newImage;
                locationImage.alt = "Custom Location";
            }
        });

    </script>
</body>
</html>
